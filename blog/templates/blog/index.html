{% extends "base.html" %}

{% block page_header %}
{% endblock page_header %}

{% block page_content %}
    {% block posts %}
        {% for post in posts %}
            <h4><a href="{% url 'blog_detail' post.pk %}">{{ post.title }}</a></h4>
            <small>
                {{ post.created_on.date }}
            </small>
            <p>{{ post.body | slice:":400" }}...</p>
        {% endfor %}
    {% endblock posts %}
{% endblock page_content %}
